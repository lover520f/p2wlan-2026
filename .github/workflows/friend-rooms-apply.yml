name: Apply reviewed friend room source
on:
  push:
    branches: [feat/friend-rooms-20260907]
    paths: [.github/workflows/friend-rooms-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'yhan-sun/p2wlan' && github.ref == 'refs/heads/feat/friend-rooms-20260907'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Apply reviewed source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/flutter_client/lib/core/daemon/daemon_controller/android_vpn.dart')
          text = p.read_text()
          old = 'await transport.prepareRoom(requestJson)'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'await (transport as AndroidRoomPreparingTransport).prepareRoom(requestJson)'))
          p = Path('apps/flutter_client/test/rooms_page_test.dart')
          text = p.read_text()
          old = "find.widgetWithText(FilledButton, '创建房间')"
          assert text.count(old) == 1
          p.write_text(text.replace(old, "find.ancestor(of: find.text('创建房间'), matching: find.byWidgetPredicate((widget) => widget is FilledButton))"))
          PY
      - name: Format and resolve pinned client dependencies
        run: |
          cargo fmt --all
          cd apps/flutter_client
          flutter pub get
          dart fix --apply --code=curly_braces_in_flow_control_structures,use_null_aware_elements
          dart format .
      - name: Publish feature-only source commit
        shell: bash
        run: |
          set -euo pipefail
          git add client apps
          test "$(git ls-remote origin refs/heads/feat/friend-rooms-20260907 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat:修正房间Android类型检查与Flutter交互规范'
          git push origin "HEAD:refs/heads/feat/friend-rooms-source-${GITHUB_RUN_ID}"
          git archive --format=tar.gz HEAD -o "${RUNNER_TEMP}/p2wlan-client-source.tar.gz"
          git rev-parse HEAD > "${RUNNER_TEMP}/room-source-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2wlan-client-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p2wlan-client-source.tar.gz
            ${{ runner.temp }}/room-source-commit.txt
          retention-days: 3
      - name: Client preflight analysis and room tests
        working-directory: apps/flutter_client
        shell: bash
        run: |
          set +e
          flutter analyze > "$RUNNER_TEMP/room-analysis.txt" 2>&1
          analysis=$?
          flutter test test/room_api_test.dart test/rooms_page_test.dart --reporter expanded > "$RUNNER_TEMP/room-tests.txt" 2>&1
          tests=$?
          cat "$RUNNER_TEMP/room-analysis.txt"
          tail -120 "$RUNNER_TEMP/room-tests.txt"
          test "$analysis" = 0 && test "$tests" = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p2wlan-room-preflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/room-analysis.txt
            ${{ runner.temp }}/room-tests.txt
          retention-days: 3
