name: Apply reviewed friend room source
on:
  push:
    branches: [feat/friend-rooms-20260907]
    paths: [.github/workflows/friend-rooms-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'yhan-sun/p2wlan' && github.ref == 'refs/heads/feat/friend-rooms-20260907'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Apply checksum-bound source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          blobs = ['8dd9eeb18b8e51a4ce607118109160944e9eb6f8', 'd88cf70ed274512842d3f4d5aaf44a344b01cda9', 'b36ebca0b713623f988893f085b2d8cdac8077fd', 'b7cef748243f2560ef178e2498c5118ed0434d39']
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          data = bytearray()
          for sha in blobs:
              request = urllib.request.Request('https://api.github.com/repos/yhan-sun/p2wlan/git/blobs/' + sha, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              part = base64.b64decode(payload['content'])
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              data.extend(part)
          assert hashlib.sha256(data).hexdigest() == '4a2082b13ef32c2b413d0a9a774030063df52f329f2349ef7ce0c61c728139a3'
          patch = lzma.decompress(data)
          assert len(patch) == 108171
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-room-client.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines()
          assert paths and all((p.startswith(('apps/', 'client/')) or p == '.github/workflows/release.yml') and '..' not in p.split('/') for p in paths)
          release = pathlib.Path('.github/workflows/release.yml').read_text()
          payload = json.dumps({'content': release, 'encoding': 'utf-8'}).encode()
          request = urllib.request.Request('https://api.github.com/repos/yhan-sun/p2wlan/git/blobs', data=payload, headers={**headers, 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              release_blob = json.load(response)['sha']
          print('reviewed_release_blob=' + release_blob)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'room-source-metadata.json').write_text(json.dumps({'release_blob': release_blob}))
          subprocess.run(['git', 'restore', '--source=HEAD', '--staged', '--worktree', '.github/workflows/release.yml'], check=True)
          PY
      - name: Format and resolve pinned client dependencies
        run: |
          cargo fmt --all
          cd apps/flutter_client
          flutter pub get
          dart format .
      - name: Publish feature-only source commit
        shell: bash
        run: |
          set -euo pipefail
          git add client apps
          test "$(git ls-remote origin refs/heads/feat/friend-rooms-20260907 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat:接通好友房间界面邀请链接与Android独立身份'
          git push origin "HEAD:refs/heads/feat/friend-rooms-source-${GITHUB_RUN_ID}"
          git archive --format=tar.gz HEAD -o "${RUNNER_TEMP}/p2wlan-client-source.tar.gz"
          echo "source_branch=feat/friend-rooms-source-${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p2wlan-client-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p2wlan-client-source.tar.gz
            ${{ runner.temp }}/room-source-metadata.json
          retention-days: 3
      - name: Client preflight analysis
        working-directory: apps/flutter_client
        run: flutter analyze
      - name: Client room preflight tests
        working-directory: apps/flutter_client
        run: flutter test test/room_api_test.dart test/rooms_page_test.dart
