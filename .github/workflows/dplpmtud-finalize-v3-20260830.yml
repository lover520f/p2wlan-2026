name: Finalize DPLPMTUD V3

on:
  push:
    branches:
      - feat/dplpmtud-runtime-foundation-20260830
  workflow_dispatch:

concurrency:
  group: dplpmtud-finalize-v3-20260830
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_SHA: a7f2e71281fb40917dc89249377df384878f0fe7
      FEATURE_BRANCH: feat/dplpmtud-runtime-foundation-20260830
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claim the branch and invalidate obsolete finalizers
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/source-export-temp.yml
          rm -f .github/workflows/dplpmtud-finalize-once-20260830.yml
          rm -f .github/workflows/dplpmtud-finalize-v2-20260830.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit --allow-empty -m 'chore(ci): claim DPLPMTUD finalization'
          git push origin "HEAD:refs/heads/$FEATURE_BRANCH"
          echo "claimed_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Recover staged implementation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f client/daemon/src/dplpmtud.rs ]] && ! compgen -G '.github/dplpmtud-wip.patch.gz.b64.*' >/dev/null; then
            echo 'Implementation is already materialized.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          chunks = sorted(Path('.github').glob('dplpmtud-wip.patch.gz.b64.*'))
          if not chunks:
              raise SystemExit('no staged DPLPMTUD patch chunks')
          parts = [path.read_text().strip() for path in chunks]
          assembled = parts[0]
          for path, part in zip(chunks[1:], parts[1:]):
              if part in assembled:
                  print(f'{path}: already contained')
                  continue
              overlap = 0
              for size in range(min(len(assembled), len(part)), 0, -1):
                  if assembled.endswith(part[:size]):
                      overlap = size
                      break
              print(f'{path}: overlap={overlap}, append={len(part) - overlap}')
              assembled += part[overlap:]
          compressed = base64.b64decode(assembled, validate=True)
          patch = gzip.decompress(compressed)
          Path('/tmp/dplpmtud-wip.patch').write_bytes(patch)
          print(f'assembled_base64={len(assembled)} compressed={len(compressed)} patch={len(patch)}')
          PY
          git apply --check /tmp/dplpmtud-wip.patch
          git apply /tmp/dplpmtud-wip.patch

      - name: Repair recovered Rust source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('client/daemon/src/dplpmtud.rs')
          if not path.exists():
              raise SystemExit('client/daemon/src/dplpmtud.rs was not materialized')
          lines = path.read_text().splitlines()
          old = '(token_start >= prefix_len).then_some(&payload[prefix_len..token_start])'
          target = next((i for i, line in enumerate(lines) if old in line), None)
          if target is not None:
              start = next(i for i in range(target, -1, -1) if re.search(r'\bfn\b', lines[i]))
              if not any('Option<&[u8]>' in lines[i] for i in range(start, target + 1)):
                  raise SystemExit('borrowed return signature was not found')
              for i in range(start, target + 1):
                  lines[i] = lines[i].replace('Option<&[u8]>', 'Option<Vec<u8>>')
              lines[target] = lines[target].replace(
                  old,
                  '(token_start >= prefix_len).then(|| payload[prefix_len..token_start].to_vec())',
              )
          for i in range(329, min(len(lines), 365)):
              if re.fullmatch(r'(\s*)now: Instant,', lines[i]):
                  lines[i] = re.sub(r'now: Instant,', '_now: Instant,', lines[i])
                  break
          path.write_text('\n'.join(lines) + '\n')
          PY
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Compile
        run: cargo check -p p2wlan-daemon --all-targets --all-features

      - name: Apply safe Clippy fixes
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p p2wlan-daemon --all-targets --all-features --fix --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all

      - name: Strict Clippy
        run: cargo clippy -p p2wlan-daemon --all-targets --all-features -- -D warnings

      - name: Run DPLPMTUD tests
        run: cargo test -p p2wlan-daemon dplpmtud -- --nocapture

      - name: Run daemon library tests
        run: cargo test -p p2wlan-daemon --lib

      - name: Run deterministic blackhole tests five times
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(
            cargo test -p p2wlan-daemon --lib -- --list \
              | sed -n 's/: test$//p' \
              | grep -Ei '((dplpmtud|pmtu|mtu).*(blackhole|black_hole)|(blackhole|black_hole).*(dplpmtud|pmtu|mtu))'
          )
          if (( ${#tests[@]} == 0 )); then
            echo 'No deterministic DPLPMTUD blackhole test was found.' >&2
            exit 1
          fi
          printf 'Blackhole tests:\n%s\n' "${tests[*]}"
          for round in 1 2 3 4 5; do
            echo "===== blackhole round $round/5 ====="
            for test_name in "${tests[@]}"; do
              cargo test -p p2wlan-daemon --lib "$test_name" -- --exact --nocapture
            done
          done

      - name: Install required DPLPMTUD gate
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/dplpmtud-required.yml <<'YAML'
          name: DPLPMTUD Required

          on:
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: dplpmtud-required
            cancel-in-progress: true

          jobs:
            dplpmtud-required:
              name: DPLPMTUD Required
              runs-on: ubuntu-24.04
              timeout-minutes: 90
              steps:
                - uses: actions/checkout@v4
                - name: Format
                  run: cargo fmt --all -- --check
                - name: Compile
                  run: cargo check -p p2wlan-daemon --all-targets --all-features
                - name: Strict Clippy
                  run: cargo clippy -p p2wlan-daemon --all-targets --all-features -- -D warnings
                - name: DPLPMTUD unit tests
                  run: cargo test -p p2wlan-daemon dplpmtud -- --nocapture
                - name: Deterministic blackhole acceptance, five rounds
                  shell: bash
                  run: |
                    set -euo pipefail
                    mapfile -t tests < <(
                      cargo test -p p2wlan-daemon --lib -- --list \
                        | sed -n 's/: test$//p' \
                        | grep -Ei '((dplpmtud|pmtu|mtu).*(blackhole|black_hole)|(blackhole|black_hole).*(dplpmtud|pmtu|mtu))'
                    )
                    if (( ${#tests[@]} == 0 )); then
                      echo 'No deterministic DPLPMTUD blackhole test was found.' >&2
                      exit 1
                    fi
                    for round in 1 2 3 4 5; do
                      echo "===== blackhole round $round/5 ====="
                      for test_name in "${tests[@]}"; do
                        cargo test -p p2wlan-daemon --lib "$test_name" -- --exact --nocapture
                      done
                    done
          YAML

      - name: Rebuild one clean feature commit from the fixed base
        id: rebuild
        shell: bash
        env:
          CLAIMED_HEAD: ${{ steps.claim.outputs.claimed_head }}
        run: |
          set -euo pipefail
          rm -f .github/dplpmtud-wip.patch.gz.b64.*
          rm -f .github/workflows/dplpmtud-finalize-v3-20260830.yml
          git diff --check
          git diff --binary "$BASE_SHA" > /tmp/dplpmtud-final.patch
          git reset --hard "$BASE_SHA"
          git clean -fd
          git apply --index /tmp/dplpmtud-final.patch
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(peer): add Direct UDP DPLPMTUD runtime'
          final_head=$(git rev-parse HEAD)
          echo "final_head=$final_head" >> "$GITHUB_OUTPUT"
          git push --force-with-lease="refs/heads/$FEATURE_BRANCH:$CLAIMED_HEAD" origin "HEAD:refs/heads/$FEATURE_BRANCH"

      - name: Create or update formal PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_HEAD: ${{ steps.rebuild.outputs.final_head }}
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<EOF
          ## Scope

          Adds the Direct UDP DPLPMTUD runtime foundation while preserving the existing wire format and relay behavior.

          ## Fixed identity and lifecycle

          - Base: \`$BASE_SHA\`
          - Head: \`$FINAL_HEAD\`
          - Direct path state remains generation/session/remote-candidate-epoch bound.
          - Stale and duplicate control evidence remains fail-closed and idempotent.
          - Runtime state is bounded and cleared at peer/network lifecycle boundaries.

          ## Validation

          - \`cargo fmt --all -- --check\`
          - daemon all-target/all-feature compile
          - strict daemon Clippy with warnings denied
          - DPLPMTUD targeted tests
          - daemon library test suite
          - deterministic DPLPMTUD blackhole acceptance: 5 consecutive rounds
          - PR-level \`DPLPMTUD Required\` repeats the same five rounds on the final PR Head SHA

          ## Non-goals

          No Tag, Release, version bump, signing change, or intentional wire-compatibility change.
          EOF
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$FEATURE_BRANCH" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" \
              --title 'feat(peer): add Direct UDP DPLPMTUD runtime' \
              --body-file /tmp/pr-body.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$FEATURE_BRANCH" \
              --title 'feat(peer): add Direct UDP DPLPMTUD runtime' \
              --body-file /tmp/pr-body.md
          fi
