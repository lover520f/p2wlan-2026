name: Parallel Rooms

on:
  push:
    branches: [main, feat/parallel-rooms-20260908]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallel-rooms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: Parallel room lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Resolve dependencies
        working-directory: apps/flutter_client
        run: flutter pub get
      - name: Format check
        working-directory: apps/flutter_client
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: apps/flutter_client
        run: flutter analyze
      - name: Parallel lifecycle and native route inventory tests
        working-directory: apps/flutter_client
        run: flutter test test/parallel_rooms_test.dart test/room_route_inventory_test.dart

  required:
    name: Parallel Rooms Required
    if: always()
    needs: [lifecycle]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce parallel room contracts
        env:
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
        run: test "$LIFECYCLE_RESULT" = success
